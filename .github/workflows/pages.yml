name: Deploy to GitHub Pages

on:
  # Spustí se při push na main branch
  push:
    branches:
      - main
  # Umožní manuální spuštění z GitHub Actions tab
  workflow_dispatch:

# Nastavení oprávnění pro GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Povolení concurrent workflows, ale zrušení předchozích běhů
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Astro
        run: npm run build
      
      - name: List dist contents
        run: ls -la dist/ || echo "Dist folder not found"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

